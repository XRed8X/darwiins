<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>404 | Darwiins</title>
  <meta name="robots" content="noindex" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    :root {
      color-scheme: light;
      --ink: #111111;
      --muted: #5f6368;
      --accent: #c8102e;
      --bg: #ffffff;
      --line: #ececec;
    }

    * { 
      box-sizing: border-box; 
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: radial-gradient(circle at 15% 15%, rgba(200, 16, 46, 0.04), transparent 50%), var(--bg);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }
    .wrapper {
      display: grid;
      grid-template-columns: 1fr;
      gap: 60px;
      max-width: 1000px;
      width: 100%;
      align-items: center;
    }

    .container {
      max-width: 480px;
      width: 100%;
      animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .code {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--accent);
      margin-bottom: 16px;
    }

    h1 {
      font-size: clamp(2rem, 5vw, 2.75rem);
      font-weight: 600;
      line-height: 1.15;
      letter-spacing: -0.03em;
      margin-bottom: 16px;
    }

    p {
      color: var(--muted);
      font-size: clamp(1rem, 2vw, 1.05rem);
      line-height: 1.6;
      letter-spacing: -0.01em;
      margin-bottom: 40px;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 32px;
      flex-wrap: wrap;
    }

    a {
      display: inline-flex;
      align-items: center;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      transition: all 0.25s ease;
    }

    .primary {
      background: var(--accent);
      color: #ffffff;
      padding: 14px 28px;
      border-radius: 4px;
    }

    .primary:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .secondary {
      color: var(--ink);
      padding: 4px 0;
      border-bottom: 1px solid var(--ink);
    }

    .secondary:hover {
      color: var(--accent);
      border-color: var(--accent);
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (min-width: 768px) {
      .wrapper {
        grid-template-columns: 1.2fr 1fr;
        gap: 80px;
      }
    }
  </style>
</head>
<body>
  <div class="wrapper">
    
    <main class="container" role="main">
      <span class="code">Error 404</span>
      <h1>Esta página no existe.</h1>
      <p>Puede que la URL esté mal escrita o que el contenido haya cambiado de lugar.</p>
      <div class="actions">
        <a class="primary" href="/">Ir al inicio</a>
        <a class="secondary" href="https://wa.me/524494028170?text=Hola%2C%20me%20gustaria%20mas%20informacion%20sobre%20Darwiins.">Contactar por WhatsApp</a>
      </div>
    </main>

    <div class="hero-art reveal" aria-hidden="true">
      <img src="assets/darwiins.svg" alt="Darwiins logo" class="ink-splash" />
    </div>

  </div>

  <script>

    document.addEventListener("DOMContentLoaded", () => {
      const heroArt = document.querySelector('.hero-art');
      if (heroArt) {
        setTimeout(() => {
          heroArt.classList.add('is-visible');
        }, 150);
      }
    });
  </script>
</body>
</html>
